[workspace]
members = [
    "crates/hb-core",
    "crates/hb-graph",
    "crates/hb-exec",
    "crates/hb-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Ashutosh Kumar Singh <ashutosh0x@users.noreply.github.com>"]
repository = "https://github.com/Ashutosh0x/hyperblaze"
description = "Next-generation build system -- faster than Bazel, smarter than everything else"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# gRPC (for daemon, remote execution)
tonic = "0.12"
prost = "0.13"

# CLI
clap = { version = "4", features = ["derive", "env", "color"] }

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Hashing
blake3 = "1"

# File watching
notify = "7"

# Database (graph persistence)
redb = "2"

# Concurrency
dashmap = "6"
crossbeam = "0.8"
rayon = "1"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
miette = { version = "7", features = ["fancy"] }
thiserror = "2"

# Misc
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

[workspace.dev-dependencies]
tempfile = "3"
