name: Feature request
description: Propose a capability, rule, or workflow improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are most useful when they explain the user workflow and current workaround.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what blocks you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or API you want Hyperblaze to support.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Mention any workaround or related build-system behavior.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - Rust rules
        - Graph engine
        - Caching
        - File watching
        - Remote execution
        - Documentation
        - Other
    validations:
      required: true
